name: Format suggestions

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/julia-format@cde9661e440a6a214c9c0c2c63a3dbdaa5fabd2f # v4
        with:
          # JuliaFormatter package major (not Julia language version)
          version: "2"
          check: "true"
          paths: "src/, test/"
